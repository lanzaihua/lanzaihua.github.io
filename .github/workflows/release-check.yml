name: Release consistency

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  actions: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify release, tag, Pages build and live build id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/verify-release.js --online
