name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Unit, data, QA and repo-language gates
        run: npm run check
      - name: Install browser for real interaction tests
        run: npx playwright-core install --with-deps chromium
      - name: Build single-file and static-site artifacts
        run: npm run build && npm run build:pages && npm run prepare:pages
      - name: Committed artifacts must match this build
        run: |
          git diff --exit-code -- index.html data 404.html favicon.svg manifest.webmanifest robots.txt sitemap.xml sw.js _headers .nojekyll
      - name: Verify published files match source build
        run: npm run verify:pages && npm run verify:build && npm run verify:skills
      - name: Page weight and split-bank gate
        run: npm run qa:size
      - name: Split bank, IndexedDB cache and deep links
        run: npm run qa:pages
      - name: Fresh browser must never overwrite cloud state
        run: npm run qa:sync
      - name: Real browser core flows on six viewports
        run: |
          node server.js > /tmp/notebook-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/api/health >/dev/null
          PAGE_URL=http://127.0.0.1:4173 npm run qa:responsive
          PAGE_URL=http://127.0.0.1:4173 npm run qa:paper
          PAGE_URL=http://127.0.0.1:4173 npm run qa:filters
          PAGE_URL=http://127.0.0.1:4173 npm run qa:final
          PAGE_URL=http://127.0.0.1:4173 npm run qa:polish
          PAGE_URL=http://127.0.0.1:4173 npm run qa:resume
      - name: Formula rendering regression
        run: npm run qa:formulas

      - name: WCAG accessibility regression
        run: npm run qa:a11y

      - name: Performance regression
        run: npm run qa:perf
