<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 四科错题本</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
(function () {
  try {
    var path = location.pathname.replace(/\/+$/, '');
    if (!path || path === '/' || path === '/404.html' || path === '/index.html' || /\.[a-z0-9]+$/i.test(path)) return;
    var seg = path.replace(/^\/+/, '');
    var q = location.search ? location.search.slice(1) : '';
    var h = location.hash || '';
    var target = '/#/' + seg + (q ? '?' + q : '') + h;
    location.replace(target);
  } catch (e) { /* 保留静态兜底页 */ }
})();
</script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1e9; color: #2a2622; font: 16px/1.7 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; }
  main { max-width: 34rem; padding: 2rem; }
  .seal { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 9px; background: #b23a26; color: #fff8f2; font-family: serif; font-size: 24px; }
  h1 { margin: 1rem 0 .4rem; font: 600 2rem/1.25 Georgia, "Noto Serif SC", serif; }
  p { color: #6b6359; }
  a { color: #9b2c1f; }
  @media (prefers-color-scheme: dark) { body { background: #1f1c19; color: #eee8df; } p { color: #b7aea3; } a { color: #e6a08f; } }
</style>
</head>
<body>
<main>
  <span class="seal" aria-hidden="true">题</span>
  <h1>这个页面不存在</h1>
  <p>链接可能写错了，或者页面已经移动。正在尝试回到对应页面；如果 3 秒内没有跳转，请点下面的链接。</p>
  <p><a href="/">回到四科错题本首页</a></p>
</main>
</body>
</html>
