.entry-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.entry-side { display: flex; align-items: center; gap: 8px; }
.status-pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 10.5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.status-pill.is-mastered { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.status-pill.is-unmastered { color: var(--accent); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.caret { width: 10px; height: 10px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(45deg); transition: transform .22s ease; margin-left: 4px; }
.entry.is-open .caret { transform: rotate(-135deg); }
.entry-body { border-top: 1px solid var(--line); padding: 0 20px 22px; }
.mastery-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin: 16px 0 4px; padding: 11px 13px;
  background: var(--surface-2); border-radius: var(--radius-ctl);
}
.mastery-q { font-size: 11.5px; color: var(--muted); }
.mastery-q b { color: var(--ink); font-weight: 600; }
.mastery-btns { display: flex; gap: 6px; margin-left: auto; }
.m-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line-strong);
  font-size: 11.5px; color: var(--muted); background: var(--surface);
  transition: all .16s ease;
}
.m-btn:hover { border-color: var(--ink-soft); color: var(--ink); }
.m-btn .tick { font-size: 11px; }
.m-btn.is-on[data-mastery="mastered"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.m-btn.is-on[data-mastery="unmastered"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mastery-note { font-size: 10.5px; color: var(--faint); width: 100%; }
.entry-blocks { margin-top: 6px; }
.block { margin-top: 22px; }
.block-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.block-num { font-family: var(--font-mono); font-size: 10px; color: var(--faint); letter-spacing: .1em; }
.block-title { font-family: var(--font-serif); font-size: 15px; font-weight: 700; margin: 0; }
.block-original .md { font-size: 15.5px; line-height: 1.85; }
.block-original { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-ctl); padding: 14px 16px; }
.block-original .block-head { margin-bottom: 4px; }
.block-standard { border-left: 2px solid var(--ink-soft); padding-left: 16px; }
.block-analysis .md { color: var(--ink-soft); }
.block-answer .md { background: var(--accent-soft); border-radius: 8px; padding: 10px 13px; }
.block-attempt .md, .block-pitfalls .md { color: var(--muted); }
.block-reviewlog .md { font-size: 12.5px; color: var(--muted); }
.tpl-notes { margin-top: 22px; border: 1px dashed var(--line-strong); border-radius: var(--radius-ctl); padding: 14px 16px; background: color-mix(in srgb, var(--surface-2) 46%, transparent); }
.tpl-notes h4 { margin: 0 0 10px; font-size: 10.5px; letter-spacing: .18em; color: var(--faint); font-weight: 600; }
.tpl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; }
.tpl-grid dt { font-size: 11px; color: var(--faint); margin-bottom: 3px; }
.tpl-grid dd { margin: 0; font-size: 12.5px; line-height: 1.7; }
.variant { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.variant-label { font-size: 10.5px; letter-spacing: .16em; color: var(--faint); margin-bottom: 6px; }
.review-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; border-top: 1px solid var(--line); padding-top: 16px; }
.review-row .lbl { font-size: 10.5px; letter-spacing: .16em; color: var(--faint); }
.rev-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 10.5px; color: var(--muted);
  transition: all .14s ease;
}
.rev-chip.is-on { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 36%, var(--line)); color: var(--ok); }
.entry-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
.entry-foot .spacer { margin-left: auto; }
.related { margin-top: 20px; border: 1px solid var(--line); border-radius: var(--radius-ctl); padding: 14px 16px; background: var(--surface-2); }
.related-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.related-head h4 { margin: 0; font-family: var(--font-serif); font-size: 13.5px; }
.related-list { display: grid; gap: 8px; }
.related-item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
.related-item:last-child { border-bottom: 0; }
.related-item .rid { font-family: var(--font-mono); font-size: 10px; color: var(--faint); }
.related-item .rtitle { color: var(--ink-soft); }
.related-item button { color: var(--accent); font-size: 10.5px; white-space: nowrap; }

/* ---------- templates ---------- */
.tpl-chapter { margin-bottom: 30px; }
.tpl-chapter h3 { font-family: var(--font-serif); font-size: 17px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
.tpl-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); font-weight: 400; }
.tpl-card { border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); margin-bottom: 10px; overflow: hidden; }
.tpl-card summary { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; list-style: none; }
.tpl-card summary::-webkit-details-marker { display: none; }
.tpl-card summary:hover { background: var(--surface-2); }
.tpl-id { font-family: var(--font-mono); font-size: 11px; color: var(--subj); white-space: nowrap; }
.tpl-name { font-family: var(--font-serif); font-size: 14.5px; font-weight: 600; flex: 1; }
.tpl-card .caret { margin-left: 0; flex: 0 0 auto; }
.tpl-card[open] .caret { transform: rotate(-135deg); }
.tpl-body { padding: 2px 20px 18px; border-top: 1px solid var(--line); }
.tpl-sec { margin-top: 12px; }
.tpl-sec h5 { margin: 0 0 4px; font-size: 10.5px; letter-spacing: .16em; color: var(--faint); font-weight: 600; }
.tpl-sec .md { font-size: 12.5px; line-height: 1.75; }
.tpl-entry-links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- bank ---------- */
.bank-list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); overflow: hidden; }
.bank-item { padding: 18px 22px; border-bottom: 1px solid var(--line); }
.bank-item:last-child { border-bottom: 0; }
.bank-top { display: flex; align-items: baseline; gap: 12px; }
.bank-id { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }
.bank-title { font-family: var(--font-serif); font-size: 15.5px; font-weight: 600; margin: 0; flex: 1; }
.bank-meta { display: flex; gap: 4px; margin-left: auto; }
.bank-q { margin-top: 8px; font-size: 13.5px; }
.bank-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.bank-answer { margin-top: 12px; padding: 12px 14px; background: var(--surface-2); border-radius: var(--radius-ctl); font-size: 12.5px; }
.bank-answer[hidden] { display: none; }
.bank-solution { margin: 8px 0 0; padding-left: 18px; color: var(--ink-soft); font-size: 12.5px; }
.bank-empty { padding: 40px; text-align: center; color: var(--faint); }

/* ---------- markdown ---------- */
.md { font-size: 13.5px; line-height: 1.82; overflow-wrap: break-word; }
.md > *:first-child { margin-top: 0; }
.md > *:last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--font-serif); line-height: 1.35; margin: 18px 0 8px; }
.md h1 { font-size: 19px; } .md h2 { font-size: 16.5px; } .md h3 { font-size: 15px; } .md h4 { font-size: 13.5px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 1.4em; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--faint); }
.md strong { font-weight: 700; color: var(--ink); }
.md em { font-style: italic; }
.md code {
  font-family: var(--font-mono); font-size: .88em;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 5px; padding: .1em .35em; white-space: break-spaces;
}
.md pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-ctl); padding: 12px 14px; overflow-x: auto; }
.md pre code { border: 0; background: none; padding: 0; font-size: 12px; }
.md blockquote { margin: 10px 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--line-strong); color: var(--muted); }
.md table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 12.5px; }
.md th, .md td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); font-weight: 600; color: var(--ink-soft); font-size: 11.5px; }
.table-wrap { overflow-x: auto; margin: 10px 0; }
.table-wrap table { margin: 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.md details { border: 1px dashed var(--line-strong); border-radius: var(--radius-ctl); padding: 8px 12px; margin: 10px 0; background: color-mix(in srgb, var(--surface-2) 40%, transparent); }
.md summary { cursor: pointer; font-size: 11.5px; color: var(--muted); }
.md .math-display { display: block; overflow-x: auto; overflow-y: hidden; padding: 6px 2px; }
.md math { font-size: 1.06em; }
.md .math-raw { color: var(--accent); font-size: 12px; }

/* ---------- dialog ---------- */
dialog {
  border: 1px solid var(--line-strong); border-radius: var(--radius-card);
  background: var(--surface); color: var(--ink);
  padding: 0; width: min(780px, calc(100vw - 40px)); max-height: min(86dvh, 900px);
  box-shadow: 0 30px 90px -30px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.04) inset;
}
dialog::backdrop { background: color-mix(in srgb, var(--paper-deep) 62%, transparent); backdrop-filter: blur(3px); }
.dlg-head {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; gap: 12px;
  padding: 18px 22px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px);
}
.dlg-title { font-family: var(--font-serif); font-size: 17px; font-weight: 700; margin: 0; flex: 1; }
.dlg-body { padding: 20px 22px 26px; overflow-y: auto; max-height: calc(86dvh - 68px); }
.dlg-foot { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 14px 22px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 96%, transparent); backdrop-filter: blur(10px); }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: grid; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 10.5px; letter-spacing: .12em; color: var(--faint); }
.field input, .field select, .field textarea {
  border: 1px solid var(--line); border-radius: var(--radius-ctl); background: var(--surface);
  padding: 8px 10px; font-size: 13px; width: 100%;
}
.field textarea { min-height: 84px; resize: vertical; line-height: 1.65; font-family: var(--font-sans); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ink-soft); }
.field .hint { font-size: 10.5px; color: var(--faint); }
.form-section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.form-section > h4 { margin: 0 0 12px; font-family: var(--font-serif); font-size: 14px; }
.block-editor { border: 1px solid var(--line); border-radius: var(--radius-ctl); padding: 12px; margin-bottom: 10px; background: var(--surface-2); }
.block-editor-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.block-editor-head input { border: 1px solid transparent; background: transparent; font-family: var(--font-serif); font-weight: 600; font-size: 13px; padding: 3px 5px; flex: 1; }
.block-editor-head input:hover { border-color: var(--line); }
.block-editor textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 9px 10px; font-size: 12.5px; line-height: 1.7; resize: vertical; min-height: 80px; }
.block-editor textarea:focus { outline: none; border-color: var(--ink-soft); }
.mini-actions { display: flex; gap: 4px; margin-left: auto; }
.icon-mini { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--muted); font-size: 12px; }
.icon-mini:hover { color: var(--ink); border-color: var(--line-strong); }
.check-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; }
.check-row label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); letter-spacing: 0; }
.check-row input { accent-color: var(--accent); }
.preview { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; display: none; }
.preview.is-on { display: block; }
.form-note { font-size: 11px; color: var(--faint); margin: 10px 0 0; }
.mastery-picker { display: flex; gap: 6px; }
.mastery-picker button { flex: 1; border: 1px solid var(--line-strong); border-radius: var(--radius-ctl); padding: 8px; font-size: 12px; color: var(--muted); background: var(--surface); }
.mastery-picker button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface-2); }

/* ---------- settings / misc ---------- */
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row .st { font-size: 13px; }
.setting-row .sd { font-size: 11px; color: var(--faint); margin-top: 2px; }
.sync-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--faint); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.sync-dot.ok { background: var(--ok); }
.sync-dot.err { background: var(--accent); }
.toast-wrap { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 100; display: grid; gap: 8px; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast {
  background: var(--ink); color: var(--paper); font-size: 12.5px;
  padding: 10px 16px; border-radius: 999px;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.4);
  animation: toast-in .22s ease both;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.restore-banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius-ctl); margin-bottom: 18px; font-size: 12px; color: var(--muted); }
.empty-state { border: 1px dashed var(--line-strong); border-radius: var(--radius-card); padding: 54px 30px; text-align: center; background: color-mix(in srgb, var(--surface) 60%, transparent); }
.empty-state .es-title { font-family: var(--font-serif); font-size: 24px; margin: 0 0 8px; }
.empty-state .es-text { color: var(--muted); font-size: 13px; margin: 0 auto 18px; max-width: 44ch; }
.multi-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .hero { grid-template-columns: 1fr; gap: 20px; }
  .hero-side { border-left: 0; border-top: 1px solid var(--line); padding-left: 0; padding-top: 18px; }
  .grid-2 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .mobile-brand { display: flex; align-items: center; gap: 10px; }
  .mobile-brand .brand-name { font-size: 16px; }
  .mobile-brand .brand-seal { width: 30px; height: 30px; flex-basis: 30px; font-size: 16px; border-radius: 6px; }
  .topbar-inner { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 18px 0; min-height: 0; }
  .mobile-subjects { display: flex; grid-column: 1 / -1; order: 3; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .mobile-subjects::-webkit-scrollbar { display: none; }
  .msub {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
    border-radius: 999px; border: 1px solid transparent; font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .msub[aria-pressed="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); font-weight: 600; }
  .msub .dot { background: var(--subj); }
  .crumb { display: none; }
  .tabs { grid-column: 1 / -1; order: 4; margin: 0; gap: 18px; }
  .tab { padding: 12px 0 11px; font-size: 12px; }
  .top-actions { order: 2; }
  .search input { width: 130px; }
  .main { padding: 22px 18px 80px; }
  .foot { padding: 16px 18px 26px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .entry-head { grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; padding: 14px 14px; }
  .entry-side .status-pill { display: none; }
  .entry-body { padding: 0 14px 18px; }
  .tpl-grid { grid-template-columns: 1fr; }
  dialog { width: 100%; max-width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; border: 0; }
  dialog .dlg-body { max-height: calc(100dvh - 132px); }
  .field-grid { grid-template-columns: 1fr; }
  .bank-item { padding: 16px; }
  .bank-top { flex-wrap: wrap; }
  .bank-meta { margin-left: 0; }
}
@media (max-width: 560px) {
  .page-head { flex-direction: column; align-items: flex-start; gap: 12px; }
  .hero { padding: 22px 20px; }
  .hero-title { font-size: 30px; }
  .stats { gap: 8px; }
  .stat { padding: 14px; }
  .stat .num { font-size: 26px; }
  .toolbar { padding: 10px; gap: 7px; }
  .entry-title { font-size: 15px; }
  .mastery-bar { gap: 8px; }
  .mastery-btns { margin-left: 0; width: 100%; }
  .mastery-btns .m-btn { flex: 1; justify-content: center; }
  .tabs { gap: 16px; }
  .search input { width: 96px; }
  .foot { flex-direction: column; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
@media print {
  .rail, .topbar, .foot, .toolbar, .mastery-bar, .entry-foot, .related { display: none !important; }
  .app { display: block; }
  .main { max-width: none; padding: 0; }
  .entry { break-inside: avoid; box-shadow: none; }
  .entry-body[hidden] { display: block !important; }
}

/* table legibility: never squeeze columns, scroll inside the wrapper */
.main, .stage, .panel, .panel-body, .grid-2 > *, .bank-item, .entry-body, .md, .table-wrap { min-width: 0; }
table.data { min-width: 640px; }
table.data td .mono { white-space: nowrap; }
.chapter-table table.data { min-width: 520px; }
@media (max-width: 900px) {
  .md table { min-width: 520px; }
  .md .table-wrap { margin-left: -4px; margin-right: -4px; }
}

@media (max-width: 900px) {
  table.data { min-width: 520px; }
  .table-wrap { max-width: 100%; -webkit-overflow-scrolling: touch; }
  html, body { overflow-x: clip; }
}

.scroll-hint { display: none; margin: 8px 0 0; font-size: 10.5px; letter-spacing: .08em; color: var(--faint); }
@media (max-width: 900px) {
  .scroll-hint { display: block; }
  .toolbar .seg { flex: 1 1 100%; }
  .toolbar .select { flex: 1 1 44%; min-width: 0; }
  .toolbar .spacer { display: none; }
}

/* ---------- AI 智能录入 ---------- */
.ai-form { display: grid; gap: 16px; }
.ai-modes { display: inline-flex; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: var(--radius-ctl); width: max-content; }
.ai-modes button { padding: 6px 14px; border-radius: 8px; font-size: 12px; color: var(--muted); }
.ai-modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.ai-textarea {
  width: 100%; min-height: 132px; resize: vertical;
  border: 1px solid var(--line); border-radius: var(--radius-ctl);
  background: var(--surface); padding: 12px 14px;
  font-size: 13.5px; line-height: 1.75;
}
.ai-textarea:focus { outline: none; border-color: var(--ink-soft); }
.ai-dropzone {
  display: grid; place-items: center; gap: 6px; text-align: center;
  padding: 22px 18px; border: 1px dashed var(--line-strong); border-radius: var(--radius-ctl);
  background: color-mix(in srgb, var(--surface-2) 42%, transparent);
  cursor: pointer; transition: border-color .16s ease, background .16s ease;
}
.ai-dropzone:hover, .ai-dropzone.is-over { border-color: var(--accent); background: var(--accent-soft); }
.ai-dropzone input { display: none; }
.ai-dropzone .dz-title { font-family: var(--font-serif); font-size: 14.5px; font-weight: 600; }
.ai-dropzone .dz-note { font-size: 11px; color: var(--faint); }
.ai-thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
