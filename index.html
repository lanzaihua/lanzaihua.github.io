<script>
(function () {
"use strict";
/* ---- 00-core.js ---- */
/* =========================================================
   00-core — constants, state, helpers
   ========================================================= */
var SEED = window.__SEED__;
var BANKS = window.__BANKS__ || {};
var PAGES = !!window.__PAGES__;
var SUBJECTS = SEED.subjects;
var SUBJ_BY_ID = {};
SUBJECTS.forEach(function (s) { SUBJ_BY_ID[s.id] = s; });
var VIEWS = [
  { id: 'overview', label: '总览' },
  { id: 'entries', label: '错题' },
  { id: 'templates', label: '模板库' },
  { id: 'bank', label: '题库' },
  { id: 'guide', label: '规范' }
];
var STORAGE_KEY = 'sanke-cuotiben-v1';
var TOKEN_KEY = 'sanke-sync-token';
var THEME_ORDER = ['auto', 'light', 'dark'];
var THEME_LABEL = { auto: '自动', light: '浅色', dark: '深色' };
var STATUS_LABEL = { mastered: '已掌握', unmastered: '未掌握' };
var ERROR_TYPES = ['概念', '计算', '方法选择', '条件漏用', '表述'];
var REVIEW_DAYS = ['d1', 'd3', 'd7', 'd15', 'd30'];
var REVIEW_LABEL = { d1: 'D1', d3: 'D3', d7: 'D7', d15: 'D15', d30: 'D30' };

var isFreshLocal = false;
var state = loadState();
var sync = {
  available: false,
  online: false,
  busy: false,
  lastSync: null,
  token: localStorage.getItem(TOKEN_KEY) || ''
};
var ui = {
  open: {},
  bankOpen: {},
  filters: {},
  bankFilters: {}
};

function deepClone(v) { return JSON.parse(JSON.stringify(v)); }
function esc(v) {
  if (v == null) return '';
  return String(v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function attr(v) { return esc(v); }
function nowIso() { return new Date().toISOString(); }
function pad(n, w) { var s = String(n); while (s.length < w) s = '0' + s; return s; }
function todayStamp() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2);
}
function formatDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2) +
    ' ' + pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2);
}
function timeAgo(iso) {
  if (!iso) return '';
  var t = new Date(iso).getTime();
  if (isNaN(t)) return '';
  var diff = Date.now() - t;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < 86400000 * 30) return Math.floor(diff / 86400000) + ' 天前';
  return formatDate(iso).slice(0, 10);
}
function stars(n) { return n > 0 ? '★'.repeat(n) : ''; }
function uniq(arr) { var seen = {}; return arr.filter(function (x) { if (seen[x]) return false; seen[x] = 1; return true; }); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function qs(sel, root) { return (root || document).querySelector(sel); }
function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

function seedState() {
  var entries = {};
  SUBJECTS.forEach(function (s) { entries[s.id] = deepClone(s.entries); });
  return {
    version: 1,
    rev: 0,
    updatedAt: nowIso(),
    activeSubject: 'gaodai',
    activeView: 'overview',
    entries: entries,
    prefs: { theme: 'auto' }
  };
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { isFreshLocal = true; return seedState(); }
    var st = JSON.parse(raw);
    if (!st || typeof st !== 'object' || !st.entries) { isFreshLocal = true; return seedState(); }
    return migrateState(st);
  } catch (e) {
    return seedState();
  }
}

function migrateState(st) {
  if (!st.version) st.version = 1;
  if (!st.rev) st.rev = 0;
  if (!st.updatedAt) st.updatedAt = nowIso();
  if (!st.prefs || !st.prefs.theme) st.prefs = { theme: 'auto' };
  SUBJECTS.forEach(function (s) {
    if (!Array.isArray(st.entries[s.id])) st.entries[s.id] = deepClone(s.entries);
    st.entries[s.id].forEach(function (e) {
      if (e.status !== 'mastered' && e.status !== 'unmastered') e.status = 'unmastered';
      if (!e.review) e.review = { d1: false, d3: false, d7: false, d15: false, d30: false };
      REVIEW_DAYS.forEach(function (d) { if (typeof e.review[d] !== 'boolean') e.review[d] = false; });
      if (!Array.isArray(e.blocks)) e.blocks = [];
      if (!Array.isArray(e.variants)) e.variants = [];
      if (!Array.isArray(e.points)) e.points = [];
      if (!Array.isArray(e.errorTypes)) e.errorTypes = [];
      if (!e.updatedAt) e.updatedAt = st.updatedAt;
    });
  });
  if (!SUBJ_BY_ID[st.activeSubject]) st.activeSubject = 'gaodai';
  if (!VIEWS.some(function (v) { return v.id === st.activeView; })) st.activeView = 'overview';
  return st;
}

function persistLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* quota */ }
}

function markDirty(extra) {
  state.updatedAt = nowIso();
  state.rev = (state.rev || 0) + 1;
  if (extra) Object.assign(state, extra);
  persistLocal();
  schedulePush();
}

function touchEntry(entry) { entry.updatedAt = nowIso(); }

function applyTheme() {
  var t = (state.prefs && state.prefs.theme) || 'auto';
  if (THEME_ORDER.indexOf(t) < 0) t = 'auto';
  document.documentElement.setAttribute('data-theme', t);
  var meta = qs('meta[name="theme-color"]');
  if (meta) {
    var dark = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    meta.setAttribute('content', dark ? '#161813' : '#f4f1e9');
  }
}

function cycleTheme() {
  var cur = (state.prefs && state.prefs.theme) || 'auto';
  var next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length];
  state.prefs.theme = next;
  applyTheme();
  persistLocal();
  toast('主题：' + THEME_LABEL[next]);
}

function toast(msg) {
  var wrap = qs('#toastWrap');
  if (!wrap) return;
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function () {
    el.style.transition = 'opacity .2s ease, transform .2s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    setTimeout(function () { el.remove(); }, 220);
  }, 2400);
}


/* ---- 05-sync.js ---- */
/* =========================================================
   03-sync — self-hosted JSON sync (optional)
   ========================================================= */
function apiHeaders(extra) {
  var h = { 'Accept': 'application/json' };
  if (sync.token) h['X-Notebook-Token'] = sync.token;
  if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
  return h;
}

function setSyncState(mode, detail) {
  sync.mode = mode;
  sync.online = mode === 'online';
  if (detail) sync.detail = detail;
  renderSyncStatus();
}

async function initSync() {
  if (PAGES) {
    setSyncState('local', 'GitHub Pages 静态版 · 仅本机保存');
    return;
  }
  if (!/^https?:$/.test(location.protocol)) {
    setSyncState('local', '文件打开 · 仅本机保存');
    return;
  }
  try {
    var health = await fetch('/api/health', { headers: apiHeaders(), cache: 'no-store' });
    if (!health.ok) throw new Error('no api');
    sync.available = true;
    var res = await fetch('/api/state', { headers: apiHeaders(), cache: 'no-store' });
    if (res.status === 401) {
      setSyncState('locked', '需要访问口令');
      if (typeof render === 'function') render();
      return;
    }
    if (!res.ok) throw new Error('bad state');
    var remote = await res.json();
    if (remote && remote.state && remote.state.entries) {
      var localTime = new Date(state.updatedAt).getTime();
      var remoteTime = new Date(remote.state.updatedAt || 0).getTime();
      if (isFreshLocal) {
        adoptRemote(remote, false);
        toast('已载入云端最新版本');
      } else if (remoteTime > localTime && (state.rev || 0) <= (remote.rev || 0)) {
        adoptRemote(remote, false);
        toast('已载入云端最新版本');
      } else if (remoteTime === localTime && (remote.rev || 0) > (state.rev || 0)) {
        state.rev = remote.rev;
        persistLocal();
      } else if ((state.rev || 0) > (remote.rev || 0)) {
        schedulePush(50);
      }
    } else {
      schedulePush(50);
    }
    sync.lastSync = remote && remote.updatedAt;
    setSyncState('online', remote && remote.rev != null ? ('rev ' + remote.rev) : '');
  } catch (e) {
    sync.available = false;
    setSyncState('local', '未连接同步服务');
  }
  renderSyncStatus();
}

function adoptRemote(remote, skipRender) {
  if (!remote || !remote.state) return;
  var st = migrateState(remote.state);
  st.rev = remote.rev || st.rev || 0;
  st.updatedAt = remote.updatedAt || st.updatedAt;
  var theme = state.prefs ? state.prefs.theme : 'auto';
  state = st;
  isFreshLocal = false;
  state.prefs = state.prefs || {};
  state.prefs.theme = theme;
  persistLocal();
  applyTheme();
  if (!skipRender && typeof render === 'function') render();
}

var pushTimer = null;
function schedulePush(delay) {
  if (!sync.available) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function () { pushSync(false); }, delay == null ? 900 : delay);
}

async function pushSync(manual) {
  if (!sync.available) {
    if (manual) toast('当前没有连接同步服务，数据只在本机');
    return;
  }
  if (sync.busy) { sync.pending = true; return; }
  sync.busy = true;
  renderSyncStatus();
  try {
    var attempts = 0;
    while (attempts < 3) {
      attempts++;
      var body = JSON.stringify({ baseRev: state.rev || 0, state: state });
      var res = await fetch('/api/state', {
        method: 'PUT',
        headers: apiHeaders({ 'Content-Type': 'application/json' }),
        body: body
      });
      if (res.status === 409) {
        var cur = await res.json();
        var remoteTime = new Date((cur.state && cur.state.updatedAt) || 0).getTime();
        var localTime = new Date(state.updatedAt).getTime();
        if (cur.state && remoteTime > localTime + 1500) {
          adoptRemote(cur, false);
          toast('云端有更新的改动，已载入');
          break;
        }
        state.rev = cur.rev || state.rev;
        continue;
      }
      if (res.status === 401) {
        setSyncState('locked', '需要访问口令');
        toast('同步服务需要访问口令，请在设置里填写');
        break;
      }
      if (!res.ok) throw new Error('push failed');
      var data = await res.json();
      state.rev = data.rev;
      state.updatedAt = data.updatedAt || state.updatedAt;
      persistLocal();
      sync.lastSync = data.updatedAt;
      setSyncState('online', 'rev ' + data.rev);
      if (manual) toast('已同步到云端 · rev ' + data.rev);
      break;
    }
  } catch (e) {
    setSyncState('offline', '同步失败，稍后重试');
    if (manual) toast('同步失败：' + (e.message || e));
  } finally {
    sync.busy = false;
    renderSyncStatus();
    if (sync.pending) { sync.pending = false; schedulePush(150); }
  }
}

async function pullSync(manual) {
  if (!sync.available) {
    if (manual) toast('未连接同步服务');
    return;
  }
  try {
    var res = await fetch('/api/state', { headers: apiHeaders(), cache: 'no-store' });
    if (res.status === 401) { setSyncState('locked', '需要访问口令'); return; }
    if (!res.ok) throw new Error('pull failed');
    var remote = await res.json();
    if (!remote.state || !remote.state.entries) { if (manual) toast('云端还没有数据'); return; }
    var localTime = new Date(state.updatedAt).getTime();
    var remoteTime = new Date(remote.state.updatedAt || 0).getTime();
    if ((isFreshLocal && !(state.rev || 0)) || remoteTime > localTime) {
      adoptRemote(remote, false);
      toast('已拉取云端最新版本');
    } else if (manual) {
      toast('云端没有比本地更新的版本');
    }
    sync.lastSync = remote.updatedAt;
    setSyncState('online', 'rev ' + remote.rev);
  } catch (e) {
    setSyncState('offline', '拉取失败');
    if (manual) toast('拉取失败');
  }
}

function renderSyncStatus() {
  var text = sync.available
    ? (sync.online ? '云端同步 · ' + (sync.lastSync ? timeAgo(sync.lastSync) : '已连接') : (sync.mode === 'locked' ? '需要口令' : '未连接'))
    : '仅本机保存';
  if (sync.busy) text = '同步中…';
  qsa('[data-sync-text]').forEach(function (el) { el.textContent = text; });
  qsa('[data-sync-dot]').forEach(function (d) {
    d.className = 'sync-dot' + (sync.busy ? '' : sync.online ? ' ok' : sync.available ? ' err' : '');
  });
}


/* ---- 10-markdown.js ---- */
/* =========================================================
   01-markdown — markdown + math rendering
   ========================================================= */
var MATH_TOKEN = '\uE000M';
var MATH_END = '\uE001';

function renderMath(tex, display) {
  try {
    if (window.temml && typeof temml.renderToString === 'function') {
      return temml.renderToString(tex.trim(), { displayMode: !!display, throwOnError: false, annotate: false });
    }
  } catch (e) { /* fall through */ }
  return '<code class="math-raw">' + esc(tex) + '</code>';
}

function normalizeMathDelims(src) {
  var t = String(src || '');
  t = t.replace(/\\\[([\s\S]*?)\\\]/g, function (m, tex) { return '$$' + tex + '$$'; });
  t = t.replace(/\\\(([\s\S]*?)\\\)/g, function (m, tex) { return '$' + tex + '$'; });
  return t;
}

function wrapBareLatex(src) {
  var s = String(src || '');
  var parts = s.split(/(\$\$[\s\S]*?\$\$|\$[^$\n]+\$)/);
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 1) continue;
    var t = parts[i];
    t = t.replace(/\\begin\{([a-zA-Z*]+)\}[\s\S]*?\\end\{\1\}/g, function (m) { return '$' + m + '$'; });
    t = t.replace(/\\[a-zA-Z]+(?:\s*\{[^{}]*\})*/g, function (m) { return '$' + m + '$'; });
    t = t.replace(/([A-Za-z0-9)\]])\^\{[^{}]*\}/g, function (m) { return '$' + m + '$'; });
    parts[i] = t;
  }
  return parts.join('');
}

function renderMarkdown(src) {
  if (!src) return '';
  src = normalizeMathDelims(src);
  src = wrapBareLatex(src);
  if (!window.marked) return '<p>' + esc(src) + '</p>';
  var store = [];
  var text = String(src)
    .replace(/\$\$([\s\S]*?)\$\$/g, function (m, tex) {
      store.push({ tex: tex, display: true });
      return MATH_TOKEN + (store.length - 1) + MATH_END;
    })
    .replace(/\$([^$\n]+?)\$/g, function (m, tex) {
      store.push({ tex: tex, display: false });
      return MATH_TOKEN + (store.length - 1) + MATH_END;
    });
  var html;
  try {
    html = marked.parse(text, { gfm: true, breaks: false, mangle: false, headerIds: false });
  } catch (e) {
    html = '<p>' + esc(src) + '</p>';
  }
  html = html.replace(/<p>\s*\uE000M(\d+)\uE001\s*<\/p>/g, function (m, i) {
    var q = store[+i];
    if (!q) return m;
    if (q.display) return '<div class="math-display">' + renderMath(q.tex, true) + '</div>';
    return '<p>' + renderMath(q.tex, false) + '</p>';
  });
  html = html.replace(/\uE000M(\d+)\uE001/g, function (m, i) {
    var q = store[+i];
    return q ? renderMath(q.tex, q.display) : m;
  });
  html = html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
  html = html.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/<iframe[\s\S]*?<\/iframe>/gi, '');
  html = html.replace(/\son\w+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  return html;
}

function plainText(md) {
  return String(md || '')
    .replace(/\$\$([\s\S]*?)\$\$/g, ' ')
    .replace(/\$([^$\n]+?)\$/g, ' ')
    .replace(/[#>*_|\x60\-]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/* =========================================================
   02-subject — accessors, stats, filters
   ========================================================= */
function subjectOf(id) { return SUBJ_BY_ID[id] || SUBJECTS[0]; }
function entriesOf(id) { return (state.entries && state.entries[id]) || []; }
function templatesOf(id) { return subjectOf(id).templates || []; }
function bankOf(id) { return (BANKS[id] && BANKS[id].items) || []; }
function currentSubject() { return subjectOf(state.activeSubject); }
function templateById(subjectId, tid) {
  var list = templatesOf(subjectId);
  for (var i = 0; i < list.length; i++) if (list[i].id === tid) return list[i];
  return null;
}
function findEntry(subjectId, entryId) {
  var list = entriesOf(subjectId);
  for (var i = 0; i < list.length; i++) if (list[i].id === entryId) return list[i];
  return null;
}
function entryTitle(e) {
  if (e.summary) return e.summary;
  if (e.points && e.points.length) return e.points[0];
  if (e.templateTitle) return e.templateTitle;
  return '未命名条目';
}
function entrySubtitle(e) {
  if (e.summary) return (e.points || []).join(' · ');
  if (e.templateTitle) return e.templateTitle;
  return (e.points || []).slice(1).join(' · ');
}

function statsFor(subjectId) {
  var es = entriesOf(subjectId);
  var mastered = es.filter(function (e) { return e.status === 'mastered'; }).length;
  var total = es.length;
  var errors = {};
  ERROR_TYPES.forEach(function (t) { errors[t] = 0; });
  es.forEach(function (e) { (e.errorTypes || []).forEach(function (t) { if (errors[t] != null) errors[t]++; }); });
  var chapters = {};
  es.forEach(function (e) { var c = e.chapter || '未分章'; chapters[c] = (chapters[c] || 0) + 1; });
  var last = state.updatedAt;
  es.forEach(function (e) { if (e.updatedAt && new Date(e.updatedAt) > new Date(last)) last = e.updatedAt; });
  return {
    total: total,
    mastered: mastered,
    unmastered: total - mastered,
    pct: total ? Math.round((mastered / total) * 100) : 0,
    templates: templatesOf(subjectId).length,
    bank: bankOf(subjectId).length,
    errors: errors,
    chapters: chapters,
    last: last
  };
}

function filterFor(subjectId) {
  if (!ui.filters[subjectId]) ui.filters[subjectId] = { status: 'all', chapter: 'all', template: 'all', sort: 'date-desc' };
  return ui.filters[subjectId];
}
function bankFilterFor(subjectId) {
  if (!ui.bankFilters[subjectId]) ui.bankFilters[subjectId] = { chapter: 'all', template: 'all', diff: 'all' };
  return ui.bankFilters[subjectId];
}

function sortEntries(list, subjectId) {
  var mode = filterFor(subjectId).sort || 'date-desc';
  var arr = list.slice();
  arr.sort(function (a, b) {
    if (mode === 'date-desc') return String(b.date || '').localeCompare(String(a.date || ''));
    if (mode === 'date-asc') return String(a.date || '').localeCompare(String(b.date || ''));
    if (mode === 'code-asc') return String(a.code || '').localeCompare(String(b.code || ''), undefined, { numeric: true });
    if (mode === 'stars-desc') return (b.stars || 0) - (a.stars || 0);
    return 0;
  });
  return arr;
}

function entryMatches(e, q) {
  if (!q) return true;
  var hay = [entryTitle(e), e.summary, e.chapter, e.templateTitle, e.templateId, e.source]
    .concat(e.points || []).join(' ');
  (e.blocks || []).forEach(function (b) { hay += ' ' + plainText(b.md); });
  return hay.toLowerCase().indexOf(q.toLowerCase()) >= 0;
}

function searchQuery() {
  var el = qs('#searchInput');
  return el ? el.value.trim() : '';
}

function filteredEntries(subjectId) {
  var f = filterFor(subjectId);
  var q = searchQuery();
  var list = entriesOf(subjectId).filter(function (e) {
    if (f.status !== 'all' && e.status !== f.status) return false;
    if (f.chapter !== 'all' && e.chapter !== f.chapter) return false;
    if (f.template !== 'all' && e.templateId !== f.template) return false;
    return entryMatches(e, q);
  });
  return sortEntries(list, subjectId);
}

/* ---------- 举一反三 matching ---------- */
function relatedBank(entry, limit) {
  var items = bankOf(entry.subject);
  var scored = items.map(function (it) {
    var score = 0;
    if (it.templateId && it.templateId === entry.templateId) score += 6;
    if (entry.points && it.pointKeys) {
      entry.points.forEach(function (p) {
        it.pointKeys.forEach(function (k) {
          if (p && k && (p.indexOf(k) >= 0 || k.indexOf(p) >= 0)) score += 2;
        });
      });
    }
    if (it.relatedEntries && it.relatedEntries.indexOf(entry.code) >= 0) score += 4;
    if (it.chapter && entry.chapter && it.chapter === entry.chapter) score += 1;
    return { it: it, score: score };
  }).filter(function (x) { return x.score > 0; });
  scored.sort(function (a, b) { return b.score - a.score; });
  return scored.slice(0, limit || 3).map(function (x) { return x.it; });
}

/* ---------- code generation ---------- */
function nextCode(subjectId) {
  var es = entriesOf(subjectId);
  if (subjectId === 'jieji') {
    var day = todayStamp().replace(/-/g, '');
    var n = es.filter(function (e) { return String(e.code || '').indexOf('AG-' + day) === 0; }).length + 1;
    return 'AG-' + day + '-' + pad(n, 2);
  }
  if (subjectId === 'shufen') {
    var max = 0;
    es.forEach(function (e) { var m = String(e.code || '').match(/M-(\d+)/); if (m) max = Math.max(max, +m[1]); });
    return 'M-' + pad(max + 1, 3);
  }
  var mx = 0;
  es.forEach(function (e) { if (/^\d+$/.test(String(e.code))) mx = Math.max(mx, +e.code); });
  return pad(mx + 1, 3);
}

function setVar(name, value) { document.documentElement.style.setProperty(name, value); }

function entryCodeLabel(e) { return e.code; }

function renderInline(src) {
  if (!src) return '';
  var html = renderMarkdown(src);
  html = html.replace(/<\/?p>/g, ' ').replace(/\n/g, ' ').trim();
  return html;
}

function viewEntries(subjectId) {
  var f = filterFor(subjectId);
  var list = filteredEntries(subjectId);
  var all = entriesOf(subjectId);
  var counts = {
    all: all.length,
    unmastered: all.filter(function (e) { return e.status === 'unmastered'; }).length,

  };

  var toolbar = '<div class="toolbar">' +
    '<div class="seg" role="group" aria-label="按掌握状态筛选">' +
      segButton('all', '全部 ' + counts.all, f.status === 'all') +
      segButton('unmastered', '未掌握 ' + counts.unmastered, f.status === 'unmastered') +
      segButton('mastered', '已掌握 ' + counts.mastered, f.status === 'mastered') +
    '</div>' +
    '<select class="select" data-filter="chapter" aria-label="按章节筛选">' + optionList(['all'].concat(chapters), f.chapter, '全部章节') + '</select>' +

    '<select class="select" data-filter="sort" aria-label="排序">' +
      '<option value="date-desc"' + (f.sort === 'date-desc' ? ' selected' : '') + '>日期 · 新到旧</option>' +
      '<option value="date-asc"' + (f.sort === 'date-asc' ? ' selected' : '') + '>日期 · 旧到新</option>' +
      '<option value="code-asc"' + (f.sort === 'code-asc' ? ' selected' : '') + '>编号升序</option>' +
      '<option value="stars-desc"' + (f.sort === 'stars-desc' ? ' selected' : '') + '>难度 · 高到低</option>' +
    '</select>' +
    '<span class="spacer"></span>' +
    '<span class="count-note">显示 ' + list.length + ' / ' + all.length + ' 条</span>' +
    '<button class="btn" data-act="add-entry" type="button">手动新增</button>' +
    (PAGES ? '' : '<button class="btn btn-primary" data-act="ai-open" data-subject="' + subjectId + '" type="button">智能录入</button>') +
  '</div>';

  var head = '<div class="page-head"><div><p class="eyebrow">' + esc(currentSubject().name) + ' / ENTRIES</p>' +
    '<h1 class="page-title">错题</h1>' +
    '<p class="page-sub">每道题上方都能直接标「已掌握 / 未掌握」；展开后可看标准解答、详细解析、模板和同类题。</p></div></div>';

  var listHtml;
  if (!list.length) {
    listHtml = emptyState(
      all.length ? '没有符合筛选的题' : '还没有错题',
      all.length ? '换个章节或状态看看，或清空搜索词。' : '点右上角「新增错题」，把今天问过的题记下来。',
      '<button class="btn btn-primary" data-act="add-entry" type="button">新增错题</button>'
    );
  } else {
    listHtml = '<div class="entry-list">' + list.map(renderEntryCard).join('') + '</div>';
  }
  return head + toolbar + listHtml;
}

function segButton(value, label, active) {
  return '<button data-act="filter-status" data-value="' + value + '" aria-pressed="' + active + '" type="button">' + esc(label) + '</button>';
}
function optionList(values, current, allLabel) {
  return values.map(function (v) {
    var label = v === 'all' ? allLabel : v;
    return '<option value="' + attr(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');
}
function optionList2(tpls, current) {
  return '<option value="all"' + (current === 'all' ? ' selected' : '') + '>全部模板</option>' +
    tpls.map(function (t) {
      return '<option value="' + attr(t.id) + '"' + (t.id === current ? ' selected' : '') + '>' + esc(t.id + ' · ' + t.title) + '</option>';
    }).join('');
}

function renderEntryCard(e) {
  var open = !!ui.open[e.id];

    (e.errorTypes || []).slice(0, 2).map(function (t) { return '<span class="chip chip-warn">' + esc(t) + '</span>'; }).join('');
  var tpl = e.templateId ? ('<button class="chip" data-act="goto-template" data-template="' + attr(e.templateId) + '" type="button">' + esc(e.templateId) + ' ' + esc(e.templateTitle || '') + '</button>') : '';

  var card =
    '<article class="entry' + (open ? ' is-open' : '') + '" id="entry-' + attr(e.id) + '">' +
      '<button class="entry-head" data-act="toggle-entry" data-id="' + attr(e.id) + '" aria-expanded="' + open + '" type="button">' +
        '<span class="entry-code">' + esc(e.code) + '<small>' + esc(currentSubject().short) + '</small></span>' +
        '<span class="entry-titlewrap">' +
          '<span class="entry-title">' + renderInline(entryTitle(e)) + '</span>' +
          '<span class="entry-meta">' +
            '<span>' + esc(e.date || '') + (e.weekday ? ' ' + esc(e.weekday) : '') + '</span>' +
            (e.chapter ? '<span class="sep">·</span><span>' + esc(e.chapter) + (e.section ? ' ' + esc(e.section) : '') + '</span>' : '') +
            (e.stars ? '<span class="sep">·</span><span class="stars">' + stars(e.stars) + '</span>' : '') +

function renderEntryBody(e) {

          '<button data-act="open-bank-item" data-bank-id="' + attr(it.id) + '" type="button">看题</button></div>';
      }).join('') + '</div></div>';
  }

  var review = '<div class="review-row">' +
    '<span class="lbl">复习打卡</span>' +
    REVIEW_DAYS.map(function (d) {
      return '<button class="rev-chip' + (e.review[d] ? ' is-on' : '') + '" data-act="toggle-review" data-id="' + attr(e.id) + '" data-day="' + d + '" type="button" aria-pressed="' + !!e.review[d] + '">' + REVIEW_LABEL[d] + ' ' + (e.review[d] ? '✓' : '□') + '</button>';

      '</span>' +
    '</div>' +
    '<div class="entry-blocks">' + blocks + '</div>' +
    tplNotes + variants + relatedHtml + review + foot;

function renderBlock(b, i) {
  var cls = 'block block-' + (b.key || 'extra');
  var num = pad(i + 1, 2);
  return '<section class="' + cls + '">' +
    '<div class="block-head"><span class="block-num">' + num + '</span><h3 class="block-title">' + esc(b.title || '内容') + '</h3></div>' +
    '<div class="md">' + renderMarkdown(b.md) + '</div>' +
  '</section>';
}

/* ---------- mastery / review handlers ---------- */
function setMastery(entryId, value) {
  var e = findEntry(state.activeSubject, entryId);
  if (!e) return;
  e.status = value === 'mastered' ? 'mastered' : 'unmastered';
  e.review.mastered = e.status === 'mastered';
  touchEntry(e);
  markDirty();
  if (state.activeView === 'entries') {
    var open = ui.open[e.id];
    ui.open[e.id] = open;
    render();
    var card = qs('#entry-' + e.id);
    if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else {
    render();
  }
  toast(e.status === 'mastered' ? '已标记为已掌握' : '已标记为未掌握');
}

function toggleReview(entryId, day) {
  var e = findEntry(state.activeSubject, entryId);
  if (!e) return;
  e.review[day] = !e.review[day];
  if (day === 'd30') {
    // keep mastered independent; review ticks are just check-ins
  }
  touchEntry(e);
  markDirty();
  render();
  var card = qs('#entry-' + e.id);
  if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function toggleEntry(entryId) {
  ui.open[entryId] = !ui.open[entryId];
  render();
  var card = qs('#entry-' + entryId);
  if (card && ui.open[entryId]) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function viewTemplates(subjectId) {
  var tpls = templatesOf(subjectId);
  var q = searchQuery();
  if (q) tpls = tpls.filter(function (t) {
    var hay = (t.id + ' ' + t.title + ' ' + (t.sections || []).map(function (s) { return s.md; }).join(' ')).toLowerCase();
    return hay.indexOf(q.toLowerCase()) >= 0;
  });
  var groups = {};
  var order = [];
  tpls.forEach(function (t) {
    var ch = t.chapter || '未分章';
    if (!groups[ch]) { groups[ch] = []; order.push(ch); }
    groups[ch].push(t);
  });
  var head = '<div class="page-head"><div><p class="eyebrow">' + esc(currentSubject().name) + ' / PATTERNS</p>' +
    '<h1 class="page-title">模板库</h1>' +
    '<p class="page-sub">每张卡是一类题的解法骨架：识别特征 → 方法 → 步骤 → 易错点。错题条目里的模板号指向这里。</p></div>' +
    '<div class="page-actions"><button class="btn" data-act="nav-view" data-view="bank" type="button">去题库</button>' +
    '<button class="btn btn-primary" data-act="add-entry" type="button">新增错题</button></div></div>';

  var body = order.map(function (ch) {
    return '<section class="tpl-chapter"><h3>' + esc(ch) + ' <span class="tpl-count">' + groups[ch].length + ' 张</span></h3>' +
      groups[ch].map(function (t) {
        var rel = entriesOf(subjectId).filter(function (e) { return e.templateId === t.id; });
        return '<details class="tpl-card"' + (ui.tplOpen === t.id ? ' open' : '') + ' id="tpl-' + attr(t.id) + '">' +
          '<summary><span class="tpl-id">' + esc(t.id) + '</span><span class="tpl-name">' + esc(t.title) + '</span><span class="caret" aria-hidden="true"></span></summary>' +
          '<div class="tpl-body">' +
            (t.sections || []).map(function (s) {
              return '<div class="tpl-sec"><h5>' + esc(s.label) + '</h5><div class="md">' + renderMarkdown(s.md) + '</div></div>';
            }).join('') +
            (rel.length ? '<div class="tpl-entry-links">' + rel.map(function (e) {
              return '<button class="chip" data-act="jump-entry" data-id="' + attr(e.id) + '" type="button">关联 ' + esc(e.code) + '</button>';
            }).join('') + '</div>' : '') +
          '</div></details>';
      }).join('') + '</section>';
  }).join('');

  return head + (q ? '<p class="form-note">搜索「' + esc(q) + '」的结果</p>' : '') +
    (tpls.length ? body : emptyState('没有匹配的模板', '换个关键词，或清空搜索。', ''));
}

function viewBank(subjectId) {
  var items = bankOf(subjectId);
  var q = searchQuery();
  var f = bankFilterFor(subjectId);
  var chapters = uniq(items.map(function (i) { return i.chapter || '未分章'; }));
  var tplIds = uniq(items.map(function (i) { return i.templateId; }).filter(Boolean));
  var filtered = items.filter(function (it) {
    if (f.chapter !== 'all' && it.chapter !== f.chapter) return false;
    if (f.template !== 'all' && it.templateId !== f.template) return false;
    if (f.diff !== 'all' && String(it.difficulty) !== f.diff) return false;
    if (q) {
      var hay = [it.title, it.question, it.chapter, it.templateId, (it.tags || []).join(' '), (it.pointKeys || []).join(' ')].join(' ').toLowerCase();
      if (hay.indexOf(q.toLowerCase()) < 0) return false;
    }
    return true;
  });

  var head = '<div class="page-head"><div><p class="eyebrow">' + esc(currentSubject().name) + ' / QUESTION BANK</p>' +
    '<h1 class="page-title">题库 · 举一反三</h1>' +
    '<p class="page-sub">按知识要点和模板整理的同类题，来自三科 skill 的题型方法。先自己写，再展开答案对照。</p></div>' +
    '<div class="page-actions"><button class="btn" data-act="nav-view" data-view="templates" type="button">看模板</button>' +
    '<button class="btn btn-primary" data-act="add-entry" type="button">新增错题</button></div></div>';

  var toolbar = '<div class="toolbar">' +
    '<select class="select" data-bank-filter="chapter" aria-label="按章节筛选题库">' + optionList(['all'].concat(chapters), f.chapter, '全部章节') + '</select>' +
    '<select class="select" data-bank-filter="template" aria-label="按模板筛选题库">' +
      '<option value="all"' + (f.template === 'all' ? ' selected' : '') + '>全部模板</option>' +
      tplIds.map(function (id) { return '<option value="' + attr(id) + '"' + (f.template === id ? ' selected' : '') + '>' + esc(id) + '</option>'; }).join('') +
    '</select>' +
    '<select class="select" data-bank-filter="diff" aria-label="按难度筛选">' +
      '<option value="all"' + (f.diff === 'all' ? ' selected' : '') + '>全部难度</option>' +
      '<option value="1"' + (f.diff === '1' ? ' selected' : '') + '>★ 基础</option>' +
      '<option value="2"' + (f.diff === '2' ? ' selected' : '') + '>★★ 常规</option>' +
      '<option value="3"' + (f.diff === '3' ? ' selected' : '') + '>★★★ 综合</option>' +
    '</select>' +
    '<span class="spacer"></span><span class="count-note">' + filtered.length + ' / ' + items.length + ' 题</span>' +
  '</div>';

  var list;
  if (!items.length) {
    list = emptyState('题库还没生成', '题库作者正在整理三科 skill 的题型与变式，稍后刷新即可；你仍然可以手动新增错题。', '<button class="btn btn-primary" data-act="add-entry" type="button">新增错题</button>');
  } else if (!filtered.length) {
    list = emptyState('没有匹配的题', '换个章节、模板或难度，或清空搜索词。', '');
  } else {
    list = '<div class="bank-list">' + filtered.map(renderBankItem).join('') + '</div>';
  }
  return head + toolbar + list;
}

function renderBankItem(it) {
  var open = !!ui.bankOpen[it.id];
  var rel = (it.relatedEntries || []).map(function (code) {
    var e = entriesOf(state.activeSubject).filter(function (x) { return x.code === code; })[0];
    return e ? '<button class="chip" data-act="jump-entry" data-id="' + attr(e.id) + '" type="button">关联 ' + esc(e.code) + '</button>' : '';
  }).join('');
  return '<article class="bank-item" id="bank-' + attr(it.id) + '">' +
    '<div class="bank-top">' +
      '<span class="bank-id">' + esc(it.id) + '</span>' +
      '<h3 class="bank-title">' + renderInline(it.title) + '</h3>' +
      '<span class="bank-meta">' +
        (it.templateId ? '<span class="chip">' + esc(it.templateId) + '</span>' : '') +
        '<span class="chip chip-star">' + stars(it.difficulty) + '</span>' +
        (it.chapter ? '<span class="chip">' + esc(it.chapter) + '</span>' : '') +
      '</span>' +
    '</div>' +
    '<div class="bank-q md">' + renderMarkdown(it.question) + '</div>' +
    '<div class="bank-actions">' +
      '<button class="btn btn-xs" data-act="toggle-bank-answer" data-bank-id="' + attr(it.id) + '" type="button">' + (open ? '收起答案' : '显示答案') + '</button>' +
      '<button class="btn btn-xs" data-act="add-from-bank" data-bank-id="' + attr(it.id) + '" type="button">加入错题本</button>' +
      (it.solution && it.solution.length ? '<span class="faint" style="font-size:10.5px">先自己写一遍，再对答案</span>' : '') +
    '</div>' +
    '<div class="bank-answer" id="answer-' + attr(it.id) + '"' + (open ? '' : ' hidden') + '>' +
      '<div class="md"><strong>答案</strong>：' + renderMarkdown(it.answer) + '</div>' +
      (it.solution && it.solution.length ? '<ol class="bank-solution">' + it.solution.map(function (s) { return '<li>' + renderMarkdown(s) + '</li>'; }).join('') + '</ol>' : '') +
      (it.pointKeys && it.pointKeys.length ? '<div style="margin-top:10px" class="multi-actions">' + it.pointKeys.map(function (p) { return '<span class="chip">' + esc(p) + '</span>'; }).join('') + rel + '</div>' : rel) +
    '</div>' +
  '</article>';
}

/* =========================================================
   40-editor — 编辑器、设置、导入导出

function errorTypesFor(subjectId) {
  if (subjectId === 'jieji') return ['概念', '公式', '计算', '思路', '审题'];
  if (subjectId === 'shufen') return ['概念', '计算', '方法', '条件', '表述'];
  return ['概念', '计算', '方法选择', '条件漏用', '表述'];
}

function defaultBlocks(subjectId) {
  if (subjectId === 'gaodai') {
    return [
      { key: 'original', title: '原题', md: '' },
      { key: 'attempt', title: '我的错解 / 卡点', md: '' },
      { key: 'standard', title: '考试标准解答', md: '' },
      { key: 'analysis', title: '详细解析', md: '' },
      { key: 'answer', title: '答案', md: '' }
    ];
  }
  if (subjectId === 'shufen') {
    return [
      { key: 'original', title: '题目', md: '' },
      { key: 'standard', title: '考试标准解答过程', md: '' },
      { key: 'analysis', title: '详细解析', md: '' },
      { key: 'verification', title: '验证', md: '' },
      { key: 'pitfalls', title: '易错点 / 当时卡在哪', md: '' },
      { key: 'reviewlog', title: '复习记录', md: '' }
    ];
  }
  return [
    { key: 'original', title: '题目', md: '' },
    { key: 'standard', title: '考试标准解答', md: '' },
    { key: 'analysis', title: '详细解析（要点）', md: '' },
    { key: 'pitfalls', title: '卡点', md: '' }
  ];
}

function blankEntry(subjectId) {
  var code = nextCode(subjectId);
  var tpls = templatesOf(subjectId);
  var now = new Date();
  return {
    id: subjectId + '-' + code,
    code: code,
    subject: subjectId,
    date: formatDate(now.toISOString()).slice(0, 16),
    weekday: '',
    stars: 2,
    chapter: tpls.length ? tpls[0].chapter : '',
    chapterCode: '',
    section: '',
    points: [],
    templateId: '',
    templateTitle: '',
    source: '',
    errorTypes: [],
    errorNote: '',
    summary: '',
    status: 'unmastered',
    review: { d1: false, d3: false, d7: false, d15: false, d30: false, mastered: false },
    blocks: defaultBlocks(subjectId),
    templateNotes: subjectId === 'gaodai' ? { features: '', method: '', skeleton: '', pitfalls: '' } : null,
    variants: [],
    updatedAt: nowIso()
  };
}

function openEditor(subjectId, entryId, prefill) {
  var dlg = qs('#editor');
  if (!dlg) return;
  var entry;
  if (entryId) {
    entry = deepClone(findEntry(subjectId, entryId));
    if (!entry) return;
    dlg.dataset.mode = 'edit';
  } else {
    entry = prefill || blankEntry(subjectId);
    dlg.dataset.mode = 'new';
  }
  dlg.dataset.subject = subjectId;
  dlg.dataset.entry = entryId || '';
  dlg._draft = entry;
  var tpls = templatesOf(subjectId);
  var chapters = uniq(entriesOf(subjectId).map(function (e) { return e.chapter; }).concat(tpls.map(function (t) { return t.chapter; }))).filter(Boolean);
  var types = errorTypesFor(subjectId);
  var isGaodai = subjectId === 'gaodai';
  var s = subjectOf(subjectId);

  var statusOptions = ['unmastered', 'mastered'].map(function (v) {
    return '<option value="' + v + '"' + (entry.status === v ? ' selected' : '') + '>' + STATUS_LABEL[v] + '</option>';
  }).join('');

  var tplOptions = '<option value="">（不挂模板）</option>' + tpls.map(function (t) {
    return '<option value="' + attr(t.id) + '"' + (entry.templateId === t.id ? ' selected' : '') + '>' + esc(t.id + ' · ' + t.title) + '</option>';
  }).join('');

  var blocksHtml = (entry.blocks || []).map(blockEditorHtml).join('');
  var variantsHtml = (entry.variants || []).map(variantEditorHtml).join('');

  var form = '' +
    '<div class="field-grid">' +
      field('编号 / CODE', '<input id="f-code" value="' + attr(entry.code) + '">', '条目编号，保持册内唯一') +
      field('日期 / DATE', '<input id="f-date" value="' + attr(entry.date) + '" placeholder="2026-10-22 13:00">', '原格式保留，可手改') +
      field('章节 / CHAPTER', '<input id="f-chapter" list="chapterList" value="' + attr(entry.chapter) + '">' +
        '<datalist id="chapterList">' + chapters.map(function (c) { return '<option value="' + attr(c) + '"></option>'; }).join('') + '</datalist>') +
      field('模板 / TEMPLATE', '<select id="f-template">' + tplOptions + '</select>') +
      field('知识要点 / POINTS', '<input id="f-points" value="' + attr((entry.points || []).join('；')) + '" placeholder="用；或、分隔">', '用于检索与举一反三匹配') +
      field('来源 / SOURCE', '<input id="f-source" value="' + attr(entry.source || '') + '" placeholder="教材 第 X 页 习题；或课堂例题">') +
      field('难度 / STARS', '<select id="f-stars">' + [1, 2, 3].map(function (n) { return '<option value="' + n + '"' + (entry.stars === n ? ' selected' : '') + '>' + stars(n) + '</option>'; }).join('') + '</select>') +
      field('掌握状态 / STATUS', '<select id="f-status">' + statusOptions + '</select>') +
      field('一句话概括 / SUMMARY', '<input id="f-summary" value="' + attr(entry.summary || '') + '" placeholder="数分条目必填；其他可留空">', '', 'full') +
    '</div>' +
    '<div class="form-section"><h4>错因标签</h4><div class="check-row" id="f-errtypes">' +
      types.map(function (t) {
        return '<label><input type="checkbox" value="' + attr(t) + '"' + ((entry.errorTypes || []).indexOf(t) >= 0 ? ' checked' : '') + '> ' + esc(t) + '</label>';
      }).join('') + '</div>' +
      '<div class="field" style="margin-top:12px"><label>错因说明 / 易错点</label><textarea id="f-errornote" placeholder="具体一句：当时卡在哪">' + esc(entry.errorNote || '') + '</textarea></div>' +
    '</div>' +
    '<div class="form-section"><h4>内容块 <span class="faint" style="font-size:11px;font-weight:400">支持 Markdown + LaTeX</span></h4>' +
      '<div id="blockEditors">' + blocksHtml + '</div>' +
      '<div class="mini-actions" style="margin-top:10px;align-items:center;gap:8px">' +
        '<select class="select" id="newBlockKey">' +
          '<option value="extra">自定义段落</option>' +
          '<option value="original">题目 / 原题</option>' +
          '<option value="standard">考试标准解答</option>' +
          '<option value="analysis">详细解析</option>' +
          '<option value="answer">答案</option>' +
          '<option value="pitfalls">易错点 / 卡点</option>' +
          '<option value="verification">验证</option>' +
          '<option value="reviewlog">复习记录</option>' +
        '</select>' +
        '<button class="btn btn-xs" data-act="add-block" type="button">添加内容块</button>' +
      '</div>' +
    '</div>' +
    (isGaodai ? '<div class="form-section"><h4>模板要点（挂在条目里的四段）</h4><div class="field-grid">' +
      field('识别特征', '<textarea id="tn-features">' + esc(entry.templateNotes && entry.templateNotes.features || '') + '</textarea>', '', 'full') +
      field('首选方法', '<textarea id="tn-method">' + esc(entry.templateNotes && entry.templateNotes.method || '') + '</textarea>', '', 'full') +
      field('步骤骨架', '<textarea id="tn-skeleton">' + esc(entry.templateNotes && entry.templateNotes.skeleton || '') + '</textarea>', '', 'full') +
      field('易错点', '<textarea id="tn-pitfalls">' + esc(entry.templateNotes && entry.templateNotes.pitfalls || '') + '</textarea>', '', 'full') +
    '</div></div>' : '') +
    '<div class="form-section"><h4>变式（自测）</h4><div id="variantEditors">' + variantsHtml + '</div>' +
      '<button class="btn btn-xs" data-act="add-variant" type="button" style="margin-top:8px">添加变式</button>' +
    '</div>' +
    '<p class="form-note">保存后立即写入本机浏览器；若已启动 server.js，会自动同步到 data/state.json。原文文件不会被修改。</p>';

  qs('#editorTitle').textContent = (entryId ? '编辑' : '新增') + ' · ' + s.name;
  qs('#editorBody').innerHTML = form;
  dlg.showModal();
  setTimeout(function () { var first = qs('#f-code'); if (first) first.focus(); }, 60);
}

function field(label, control, hint, spanClass) {

    (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') + '</div>';
}

function blockEditorHtml(b, i) {
  return '<div class="block-editor" data-block data-key="' + attr(b.key || 'extra') + '">' +
    '<div class="block-editor-head">' +
      '<input class="b-title" value="' + attr(b.title || '内容') + '" aria-label="内容块标题">' +

        '<button class="icon-mini" data-act="block-up" type="button" title="上移">↑</button>' +

        '<button class="icon-mini" data-act="block-preview" type="button" title="预览">◉</button>' +
        '<button class="icon-mini" data-act="block-remove" type="button" title="删除">×</button>' +
      '</div>' +
    '</div>' +
    '<textarea class="b-md" placeholder="支持 Markdown；公式用 $...$ 或 $$...$$">' + esc(b.md || '') + '</textarea>' +

}

function variantEditorHtml(v) {
  return '<div class="block-editor" data-variant>' +
    '<div class="block-editor-head"><input class="v-title" value="变式" aria-label="变式标题">' +
      '<div class="mini-actions"><button class="icon-mini" data-act="variant-remove" type="button" title="删除">×</button></div></div>' +
    '<textarea class="v-q" placeholder="变式题面">' + esc(v.q || '') + '</textarea>' +
    '<textarea class="v-a" style="margin-top:6px" placeholder="变式答案">' + esc(v.a || '') + '</textarea>' +
  '</div>';

function addBlockEditor(key) {
  var titles = {
    original: '原题', standard: '考试标准解答', analysis: '详细解析', answer: '答案',
    pitfalls: '易错点 / 卡点', verification: '验证', reviewlog: '复习记录', extra: '补充说明'
  };
  var wrap = document.createElement('div');
  wrap.innerHTML = blockEditorHtml({ key: key, title: titles[key] || '补充说明', md: '' });
  var host = qs('#blockEditors');
  if (host) host.appendChild(wrap.firstChild);
}

function collectEditor() {
  var dlg = qs('#editor');
  var subjectId = dlg.dataset.subject;
  var draft = dlg._draft;
  var e = draft ? deepClone(draft) : blankEntry(subjectId);
  e.code = qs('#f-code').value.trim();
  e.date = qs('#f-date').value.trim();
  e.chapter = qs('#f-chapter').value.trim();
  e.points = qs('#f-points').value.split(/[；;、,，|]/).map(function (x) { return x.trim(); }).filter(Boolean);
  e.source = qs('#f-source').value.trim();
  e.stars = +qs('#f-stars').value || 2;
  e.status = qs('#f-status').value === 'mastered' ? 'mastered' : 'unmastered';
  e.summary = qs('#f-summary').value.trim();
  var tid = qs('#f-template').value;
  e.templateId = tid;
  var tpl = tid ? templateById(subjectId, tid) : null;
  e.templateTitle = tpl ? tpl.title : '';
  e.errorTypes = qsa('#f-errtypes input:checked').map(function (x) { return x.value; });
  e.errorNote = qs('#f-errornote').value.trim();

  var blocks = [];
  qsa('#blockEditors [data-block]').forEach(function (node) {
    var md = qs('.b-md', node).value;
    var title = qs('.b-title', node).value.trim() || '内容';
    if (!md.trim() && !title) return;
    blocks.push({ key: node.getAttribute('data-key') || 'extra', title: title, md: md });
  });
  if (!blocks.length) blocks = defaultBlocks(subjectId);
  e.blocks = blocks;

  if (subjectId === 'gaodai') {
    e.templateNotes = {
      features: qs('#tn-features') ? qs('#tn-features').value.trim() : '',
      method: qs('#tn-method') ? qs('#tn-method').value.trim() : '',
      skeleton: qs('#tn-skeleton') ? qs('#tn-skeleton').value.trim() : '',
      pitfalls: qs('#tn-pitfalls') ? qs('#tn-pitfalls').value.trim() : ''
    };
  }
  var variants = [];
  qsa('#variantEditors [data-variant]').forEach(function (node) {
    var q = qs('.v-q', node).value.trim();
    var a = qs('.v-a', node).value.trim();
    if (q) variants.push({ q: q, a: a });
  });
  e.variants = variants;
  e.review = e.review || { d1: false, d3: false, d7: false, d15: false, d30: false };
  e.review.mastered = e.status === 'mastered';
  e.subject = subjectId;
  e.id = draft && dlg.dataset.mode === 'edit' ? draft.id : subjectId + '-' + e.code;
  e.updatedAt = nowIso();
  return e;
}

function saveEditor() {
  var dlg = qs('#editor');
  var subjectId = dlg.dataset.subject;
  var mode = dlg.dataset.mode;
  var e;
  try { e = collectEditor(); } catch (err) { toast('保存失败：' + err.message); return; }
  if (!e.code) { toast('编号不能为空'); return; }
  var list = entriesOf(subjectId);
  var dup = list.filter(function (x) { return x.code === e.code && x.id !== e.id; });
  if (dup.length) { toast('编号 ' + e.code + ' 已存在'); return; }

  if (mode === 'edit') {
    var idx = list.findIndex(function (x) { return x.id === e.id; });
    if (idx >= 0) list[idx] = e;
    toast('已保存 · ' + e.code);
  } else {
    if (list.some(function (x) { return x.id === e.id; })) e.id = subjectId + '-' + e.code + '-' + Date.now();
    list.push(e);
    toast('已新增 · ' + e.code);
  }
  state.activeSubject = subjectId;
  markDirty();
  dlg.close();
  render();
  state.activeView = 'entries';
  ui.open[e.id] = true;
  if (state.activeView !== 'entries') { state.activeView = 'entries'; }
  persistLocal();
  location.hash = '#/' + subjectId + '/entries';
  render();
  var el = qs('#entry-' + e.id);
  if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function deleteEntry(subjectId, entryId) {
  var e = findEntry(subjectId, entryId);
  if (!e) return;
  confirmDialog('删除条目 ' + e.code + '？', '只删除网页里的这一条；原始 Markdown 文件不受影响。删除后不能撤销。', function () {
    state.entries[subjectId] = entriesOf(subjectId).filter(function (x) { return x.id !== entryId; });
    delete ui.open[entryId];
    markDirty();
    render();
    toast('已删除 ' + e.code);
  });
}

function addFromBank(bankId) {
  var items = bankOf(state.activeSubject);
  var it = items.filter(function (x) { return x.id === bankId; })[0];
  if (!it) return;
  var e = blankEntry(state.activeSubject);
  e.summary = it.title || '';

    { key: 'attempt', title: '我的卡点', md: '' }
  ];
  openEditor(state.activeSubject, null, e);
}

function addFromEntry(entryId) {

function importStateFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var parsed = JSON.parse(String(reader.result));
      var st = parsed.state ? parsed.state : parsed;
      if (!st || !st.entries) throw new Error('不像错题本数据');
      migrateState(st);
      st.prefs = st.prefs || { theme: 'auto' };
      state = st;
      state.rev = (state.rev || 0) + 1;
      state.updatedAt = nowIso();
      persistLocal();
      markDirty();
      applyTheme();
      render();
      toast('已导入备份');
    } catch (e) {
      toast('导入失败：' + e.message);
    }
  };
  reader.readAsText(file, 'utf-8');
}

function bindAiForm() {
  var drop = qs('#aiDropzone');
  var input = qs('#aiFiles');
  if (input) {
    input.addEventListener('change', function () {
      aiAddFiles(input.files);
      input.value = '';
    });
  }
  if (drop) {
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('is-over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('is-over'); });
    });
    drop.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files) aiAddFiles(e.dataTransfer.files);
    });
  }
  var ta = qs('#aiText');
  if (ta) {
    ta.addEventListener('paste', function (e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      var files = [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file' && /^image\//.test(items[i].type)) {
          var f = items[i].getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length) {
        e.preventDefault();
        aiAddFiles(files);
      }
    });
    ta.addEventListener('input', function () { aiState.text = ta.value; });
  }
  var hint = qs('#aiHint');
  if (hint) hint.addEventListener('input', function () { aiState.hint = hint.value; });
  var subjSel = qs('#aiSubject');
  if (subjSel) {
    subjSel.addEventListener('change', function () {
      aiState.subject = subjSel.value;
      updateAiSkillUI();
    });
  }
  var form = qs('#aiForm');
  if (form) form.addEventListener('submit', function (e) { e.preventDefault(); aiSubmit(); });

async function checkAiStatus() {
  if (PAGES) {
    aiState.statusChecked = true;
    aiState.statusNote = 'GitHub Pages 静态版不支持在线 AI 生成。';
    updateAiStatusNote();
    return;
  }
  if (!/^https?:$/.test(location.protocol)) {
    aiState.statusChecked = true;
    aiState.statusNote = '当前是文件方式打开，智能录入需要先运行 node server.js。';
    updateAiStatusNote();
    return;
  }
  try {
    var res = await fetch('/api/ai/status', { headers: apiHeaders(), cache: 'no-store' });
    if (res.status === 401) {
      aiState.statusNote = '需要访问口令：请先在「设置与同步」填写口令。';
    } else if (!res.ok) {
      aiState.statusNote = '服务端未响应智能录入接口。';
    } else {
      var data = await res.json();
      aiState.statusNote = data.configured
        ? '已连接本机 DSH 账号 · ' + (data.model || 'deepseek-flash') + '，支持图片。'
        : '服务端未找到 DSH 账号授权，请先在本机 DSH 登录。';
    }
  } catch (e) {
    aiState.statusNote = '没有连上服务端，请确认 node server.js 正在运行。';
  }
  aiState.statusChecked = true;
  updateAiStatusNote();
}

function aiAddFiles(fileList) {
  var files = Array.prototype.slice.call(fileList || []).filter(function (f) { return f && /^image\//.test(f.type); });
  if (!files.length) { toast('请选择图片文件'); return; }
  var room = 3 - aiState.images.length;
  if (room <= 0) { toast('最多 3 张图片'); return; }
  files = files.slice(0, room);
  Promise.all(files.map(compressAiImage)).then(function (items) {
    aiState.images = aiState.images.concat(items);
    renderAiForm();
    toast('已加入 ' + items.length + ' 张图片');
  }).catch(function (e) {
    toast('图片读取失败：' + (e.message || e));
  });
}

function compressAiImage(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try {
        var maxEdge = 1600;
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var scale = Math.min(1, maxEdge / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.88);
        resolve({
          mediaType: 'image/jpeg',
          data: dataUrl.split(',')[1],
          preview: dataUrl,
          name: file.name || '题目图片'
        });
      } catch (e) {
        reject(e);
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error('无法解码这张图片，请换一张 JPG/PNG'));
    };
    img.src = url;
  });
}

var AI_STAGES = [
  '正在识别题目（文字与图片）…',
  '正在推导考试标准解答…',

function renderAiLoading() {

    '<div class="ai-loading">' +
      '<div class="ai-stage"><span class="pulse"></span><span id="aiStageText">' + AI_STAGES[0] + '</span></div>' +

function aiSubmit() {
  if (PAGES) { toast('GitHub Pages 静态版不支持在线 AI，请在本机运行 server.js'); return; }
  if (aiState.busy) return;
  var ta = qs('#aiText');
  if (ta) aiState.text = ta.value;
  var hint = qs('#aiHint');
  if (hint) aiState.hint = hint.value;
  if (!aiState.text.trim() && !aiState.images.length) {
    toast('请先输入题目或上传图片');
    var box = qs('#aiText');
    if (box) box.focus();
    return;
  }
  aiState.busy = true;
  aiState.result = null;
  renderAiLoading();
  var started = Date.now();
  var controller = new AbortController();
  aiState.abort = controller;
  var timer = setTimeout(function () { controller.abort(); }, 150000);
  fetch('/api/solve', {
    method: 'POST',
    headers: apiHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({
      subject: aiState.subject,
      text: aiState.text,
      hint: aiState.hint,
      images: aiState.images.map(function (im) { return { mediaType: im.mediaType, data: im.data }; })
    }),
    signal: controller.signal
  }).then(async function (res) {
    var data = null;
    try { data = await res.json(); } catch (e) { data = { error: '服务端返回了无法解析的内容' }; }
    if (!res.ok || data.error) {
      var err = new Error(data.error || ('生成失败（' + res.status + '）'));
      err.code = data.code || '';
      err.status = res.status;
      throw err;
    }
    return data;
  }).then(function (data) {
    clearTimeout(timer);
    clearAiStage();
    aiState.busy = false;
    aiState.abort = null;
    aiState.result = data;
    renderAiResult(data, Date.now() - started);
  }).catch(function (err) {
    clearTimeout(timer);
    clearAiStage();
    aiState.busy = false;
    aiState.abort = null;
    if (err && err.name === 'AbortError') {
      renderAiForm();
      toast('已取消生成');
      return;
    }
    renderAiError(err);
  });
}

function renderAiError(err) {
  var body = qs('#aiBody');
  if (!body) return;
  var msg = (err && err.message) || '生成失败';
  var extra = '';
  if (err && err.code === 'RATE_LIMIT') extra = '稍等一会儿再试；这个接口每小时有次数上限。';
  else if (err && (err.code === 'NO_CREDENTIAL' || err.code === 'UPSTREAM_AUTH')) extra = '请在电脑上确认 DSH 已登录，然后重启 node server.js。';
  else if (err && err.code === 'SKILL_MISSING') extra = '请确认 ~/.agents/skills 下存在 /' + (AI_SKILLS[aiState.subject] || '') + ' 技能目录。';
  else if (err && err.code === 'TIMEOUT') extra = '题目可能太大或模型排队；可以只保留题干，去掉多余截图再试。';
  else if (err && err.status === 401) extra = '请在「设置与同步」里填写访问口令后再试。';
  body.innerHTML = '' +
    '<div class="ai-error"><b>没有生成成功。</b><br>' + esc(msg) + (extra ? '<br><span class="faint">' + esc(extra) + '</span>' : '') + '</div>' +
    '<div class="ai-actions" style="margin-top:16px">' +
      '<button class="btn" data-act="ai-retry" type="button">回到输入</button>' +
      '<button class="btn btn-primary" data-act="ai-submit" type="button">重试</button>' +
    '</div>';
}

function renderAiResult(data, elapsedMs) {
  var r = data.result || {};
  var body = qs('#aiBody');
  if (!body) return;
  var s = subjectOf(aiState.subject);
  var skill = data.skill || { id: AI_SKILLS[aiState.subject] || '', name: s.name, chapter: null };
  var skillLabel = '/' + (skill.id || '');
  var points = (r.points || []).slice(0, 4).map(function (p) { return '<span class="chip">' + renderMarkdownInline(p) + '</span>'; }).join('');
  var conf = typeof r.confidence === 'number' ? Math.round(r.confidence * 100) + '%' : '—';
  var usage = data.usage && data.usage.output_tokens ? ('输出 ' + data.usage.output_tokens + ' tokens') : '';
  var warn = '';
  if (r.needsClarification) {
    warn = '<div class="ai-warning"><b>题目信息可能不全：</b>' + esc(r.clarification || '模型认为题干或图片不够清楚。') + '。建议对照原题补全后再保存。</div>';
  }
  var pitfalls = (r.pitfalls || []).length
    ? '<div class="ai-sec"><h4>易错点</h4><div class="md"><ul>' + r.pitfalls.map(function (p) { return '<li>' + renderMarkdownInline(p) + '</li>'; }).join('') + '</ul></div></div>'
    : '';
  var variants = (r.variants || []).length
    ? '<div class="ai-sec"><h4>变式（自测）</h4>' + r.variants.map(function (v, i) {
        return '<div style="margin-top:8px"><div class="faint" style="font-size:10.5px;letter-spacing:.1em">变式 ' + (i + 1) + '</div>' +
          '<div class="md">' + renderMarkdown(v.q) + '</div>' +
          (v.a ? '<details><summary>看答案</summary><div class="md" style="margin-top:6px">' + renderMarkdown(v.a) + '</div></details>' : '') + '</div>';
      }).join('') + '</div>'
    : '';
  var notes = r.templateNotes || {};
  var notesHtml = (notes.features || notes.method || notes.skeleton || notes.pitfalls)
    ? '<div class="ai-sec"><h4>模板要点</h4><dl class="ai-grid">' +
        (notes.features ? '<div><dt>识别特征</dt><dd>' + renderMarkdownInline(notes.features) + '</dd></div>' : '') +
        (notes.method ? '<div><dt>首选方法</dt><dd>' + renderMarkdownInline(notes.method) + '</dd></div>' : '') +
        (notes.skeleton ? '<div><dt>步骤骨架</dt><dd>' + renderMarkdownInline(notes.skeleton) + '</dd></div>' : '') +
        (notes.pitfalls ? '<div><dt>易错点</dt><dd>' + renderMarkdownInline(notes.pitfalls) + '</dd></div>' : '') +
      '</dl></div>'
    : '';
  var verification = r.verification
    ? '<div class="ai-sec"><h4>验算 / 特例</h4><div class="md">' + renderMarkdown(r.verification) + '</div></div>'
    : '';

  body.innerHTML = '' +
    '<div class="ai-result">' +
      '<div class="ai-result-head">' +
        '<span class="ai-badge">生成完成</span>' +
        '<span class="chip chip-subj" style="--subj:var(--' + s.id + ')">' + esc(s.name) + '</span>' +
        '<span class="chip mono">' + esc(skillLabel) + '</span>' +
        '<span class="chip">置信度 ' + conf + '</span>' +
        (r.chapter ? '<span class="chip">' + esc(r.chapter) + '</span>' : '') +
        '<span class="ai-usage">' + esc((data.model || '') + ' · ' + (elapsedMs / 1000).toFixed(0) + 's · ' + usage) + '</span>' +
      '</div>' +
      warn +
      '<div class="ai-summary">' + renderMarkdownInline(r.summary || '生成了一道错题') + '</div>' +
      (points ? '<div class="ai-chips">' + points + '</div>' : '') +
      '<div class="ai-sec"><h4>原题</h4><div class="md">' + renderMarkdown(r.question || aiState.text) + '</div></div>' +
      '<div class="ai-sec"><h4>考试标准解答</h4><div class="md">' + renderMarkdown(r.standardSolution || '（模型没有返回标准解答）') + '</div></div>' +
      '<div class="ai-sec"><h4>详细解析</h4><div class="md">' + renderMarkdown(r.detailedAnalysis || '（模型没有返回详细解析）') + '</div></div>' +
      (r.answer ? '<div class="ai-sec"><h4>答案</h4><div class="md" style="background:var(--accent-soft);border-radius:8px;padding:10px 13px">' + renderMarkdown(r.answer) + '</div></div>' : '') +
      verification + pitfalls + notesHtml + variants +
      '<p class="ai-note" style="margin-top:16px">以上由模型生成，可能出错。请核对题干、答案与定理依据；保存后仍可编辑。「保存并校对」会打开完整编辑器。</p>' +
      '<div class="ai-actions">' +
        '<button class="btn" data-act="ai-retry" type="button">重新生成</button>' +
        '<span class="spacer"></span>' +
        '<button class="btn" data-act="ai-save" type="button">直接入库</button>' +
        '<button class="btn btn-primary" data-act="ai-save-edit" type="button">保存并校对</button>' +
      '</div>' +
    '</div>';
}

function renderMarkdownInline(text) {
  if (!text) return '';
  var html = renderMarkdown(text);
  return html.replace(/<\/?p>/g, ' ').replace(/\n/g, ' ').trim();
}

function aiBuildDraft() {
  var r = (aiState.result && aiState.result.result) || {};
  var s = subjectOf(aiState.subject);
  var e = blankEntry(s.id);
  e.summary = r.summary || '';
  e.chapter = r.chapter || e.chapter;
  e.chapterCode = r.chapterCode || '';
  e.points = (r.points || []).slice(0, 4);
  e.templateTitle = r.templateTitle || '';
  var skillId = (aiState.result && aiState.result.skill && aiState.result.skill.id) || AI_SKILLS[s.id] || '';
  e.aiSkill = skillId;
  e.source = '智能录入 · /' + skillId + ' · ' + formatDate(nowIso()).slice(0, 16);
  e.stars = r.difficulty || 2;
  e.errorTypes = (r.errorTypes || []).filter(function (t) { return errorTypesFor(s.id).indexOf(t) >= 0; });
  e.templateNotes = s.id === 'gaodai' ? {
    features: (r.templateNotes && r.templateNotes.features) || '',
    method: (r.templateNotes && r.templateNotes.method) || '',
    skeleton: (r.templateNotes && r.templateNotes.skeleton) || '',
    pitfalls: (r.templateNotes && r.templateNotes.pitfalls) || ''
  } : null;
  e.variants = (r.variants || []).slice();
  var original = r.question || aiState.text;
  var standard = r.standardSolution || '';
  var analysis = r.detailedAnalysis || '';
  var answer = r.answer || '';
  var verification = r.verification || '';
  var pitfalls = (r.pitfalls || []).map(function (p) { return '- ' + p; }).join('\n');
  var blocks = [];
  if (s.id === 'gaodai') {
    blocks = [
      { key: 'original', title: '原题', md: original },
      { key: 'attempt', title: '我的错解 / 卡点', md: '（智能录入，待补自己的卡点）' },
      { key: 'standard', title: '考试标准解答', md: standard },
      { key: 'analysis', title: '详细解析', md: analysis },
      { key: 'answer', title: '答案', md: answer }
    ];
  } else if (s.id === 'shufen') {
    blocks = [
      { key: 'original', title: '题目', md: original },
      { key: 'standard', title: '考试标准解答过程', md: standard },
      { key: 'analysis', title: '详细解析', md: analysis },
      { key: 'verification', title: '验证', md: verification },
      { key: 'pitfalls', title: '易错点 / 当时卡在哪', md: pitfalls },
      { key: 'reviewlog', title: '复习记录', md: '- ' + formatDate(nowIso()) + ' 智能录入（待复习）' }
    ];
  } else {
    blocks = [
      { key: 'original', title: '题目', md: original },
      { key: 'standard', title: '考试标准解答', md: standard },
      { key: 'analysis', title: '详细解析（要点）', md: analysis },
      { key: 'pitfalls', title: '卡点', md: pitfalls }
    ];
  }
  e.blocks = blocks.filter(function (b) { return b.md && String(b.md).trim(); });
  if (!e.blocks.length) e.blocks = defaultBlocks(s.id);
  return e;
}

function aiSaveDirect() {
  if (!aiState.result) return;
  var e = aiBuildDraft();
  var list = entriesOf(e.subject);
  if (list.some(function (x) { return x.code === e.code; })) e.code = nextCode(e.subject);
  e.id = e.subject + '-' + e.code;
  list.push(e);
  state.activeSubject = e.subject;
  state.activeView = 'entries';
  ui.open[e.id] = true;
  markDirty();
  var dlg = qs('#aiDialog');
  if (dlg) dlg.close();
  location.hash = '#/' + e.subject + '/entries';
  render();
  toast('已保存 · ' + e.code);
  var card = qs('#entry-' + e.id);
  if (card) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function aiSaveEdit() {
  if (!aiState.result) return;
  var e = aiBuildDraft();
  var dlg = qs('#aiDialog');
  if (dlg) dlg.close();
  openEditor(e.subject, null, e);
}

function aiRetry() {
  aiState.result = null;
  aiState.busy = false;
  renderAiForm();
}


/* ---- 90-init.js ---- */
/* =========================================================
   90-init — events, routing, boot
   ========================================================= */
var suppressHash = false;

function setHash(h) {
  suppressHash = true;
  location.hash = h;
  setTimeout(function () { suppressHash = false; }, 0);
}

function parseHash() {
  var h = String(location.hash || '').replace(/^#\/?/, '');
  var entryMatch = h.match(/[?&]e=([^&]+)/);
  if (entryMatch) ui.open[decodeURIComponent(entryMatch[1])] = true;
  var clean = h.split('?')[0].split('&')[0];
  var parts = clean.split('/').filter(Boolean);
  if (parts[0] && SUBJ_BY_ID[parts[0]]) state.activeSubject = parts[0];
  if (parts[1] && VIEWS.some(function (v) { return v.id === parts[1]; })) state.activeView = parts[1];
}

function updateHash() {
  setHash('#/' + state.activeSubject + '/' + state.activeView);
}

function copyLink(entryId) {
  var url = location.origin + location.pathname + '#/' + state.activeSubject + '/entries?e=' + encodeURIComponent(entryId || '');
  var done = function () { toast('链接已复制，可在手机浏览器打开'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(function () { fallbackCopy(url); done(); });
  } else {
    fallbackCopy(url);
    done();
  }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { /* noop */ }
  ta.remove();
}

function handleAction(act, el) {
  switch (act) {
    case 'nav-subject': navSubject(el.getAttribute('data-subject')); break;
    case 'nav-view': navView(el.getAttribute('data-view')); break;
    case 'toggle-entry': toggleEntry(el.getAttribute('data-id')); break;
    case 'set-mastery': setMastery(el.getAttribute('data-id'), el.getAttribute('data-value')); break;
    case 'toggle-review': toggleReview(el.getAttribute('data-id'), el.getAttribute('data-day')); break;
    case 'filter-status': filterFor(state.activeSubject).status = el.getAttribute('data-value'); render(); break;
    case 'filter-chapter': {
      var f = filterFor(state.activeSubject);
      f.chapter = el.getAttribute('data-chapter');
      state.activeView = 'entries';
      updateHash();
      render();
      break;
    }
    case 'add-entry': openEditor(state.activeSubject, null); break;
    case 'ai-open': openAiDialog(el.getAttribute('data-subject') || state.activeSubject); break;
    case 'ai-submit': aiSubmit(); break;
    case 'ai-abort': if (aiState.abort) aiState.abort.abort(); break;
    case 'ai-retry': aiRetry(); break;
    case 'ai-remove-image': {
      var aiIdx = Number(el.getAttribute('data-index'));
      if (aiIdx >= 0 && aiIdx < aiState.images.length) {
        aiState.images.splice(aiIdx, 1);
        renderAiForm();
      }
      break;
    }
    case 'ai-save': aiSaveDirect(); break;
    case 'ai-save-edit': aiSaveEdit(); break;
    case 'edit-entry': openEditor(state.activeSubject, el.getAttribute('data-id')); break;
    case 'delete-entry': deleteEntry(state.activeSubject, el.getAttribute('data-id')); break;
    case 'jump-entry': jumpToEntry(el.getAttribute('data-id')); break;
    case 'goto-template': gotoTemplate(el.getAttribute('data-template')); break;
    case 'goto-bank': gotoBank(el.getAttribute('data-template')); break;
    case 'open-bank-item': openBankItem(el.getAttribute('data-bank-id')); break;
    case 'toggle-bank-answer': {
      var id = el.getAttribute('data-bank-id');
      ui.bankOpen[id] = !ui.bankOpen[id];
      render();
      var bankEl = qs('#bank-' + id);
      if (bankEl) bankEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      break;
    }
    case 'add-from-bank': addFromBank(el.getAttribute('data-bank-id')); break;
    case 'add-from-entry': addFromEntry(el.getAttribute('data-id')); break;
    case 'copy-link': copyLink(el.getAttribute('data-id')); break;
    case 'add-block': addBlockEditor(qs('#newBlockKey').value); break;
    case 'block-remove': {
      var b = el.closest('[data-block]');
      if (b) b.remove();
      break;
    }
    case 'block-up': {
      var up = el.closest('[data-block]');
      if (up && up.previousElementSibling) up.parentNode.insertBefore(up, up.previousElementSibling);
      break;
    }
    case 'block-down': {
      var down = el.closest('[data-block]');
      if (down && down.nextElementSibling) down.parentNode.insertBefore(down.nextElementSibling, down);
      break;
    }
    case 'block-preview': {
      var host = el.closest('[data-block]');
      if (!host) break;
      var pv = qs('.preview', host);
      var ta = qs('.b-md', host);
      if (!pv || !ta) break;
      pv.innerHTML = renderMarkdown(ta.value);
      pv.classList.toggle('is-on');
      break;
    }
    case 'add-variant': {
      var vh = qs('#variantEditors');
      if (vh) {
        var wrap = document.createElement('div');
        wrap.innerHTML = variantEditorHtml({ q: '', a: '' });
        vh.appendChild(wrap.firstChild);
      }
      break;
    }
    case 'variant-remove': {
      var vn = el.closest('[data-variant]');
      if (vn) vn.remove();
      break;
    }
    case 'save-entry': saveEditor(); break;
    case 'close-dialog': {
      var dlg = qs('#' + el.getAttribute('data-dialog'));
      if (dlg) dlg.close();
      break;
    }
    case 'open-settings': openSettings(); break;
    case 'cycle-theme': cycleTheme(); break;
    case 'set-theme': {
      state.prefs.theme = el.getAttribute('data-theme');
      applyTheme();
      persistLocal();
      openSettings();
      break;
    }
    case 'push-sync': {
      var tok = qs('#syncToken');
      if (tok) { sync.token = tok.value.trim(); localStorage.setItem(TOKEN_KEY, sync.token); }
      if (!(state.rev || 0) && sync.available) {
        pullSync(true).then(function () { pushSync(true); });
      } else {
        pushSync(true);
      }
      break;
    }
    case 'pull-sync': {
      var tok2 = qs('#syncToken');
      if (tok2) { sync.token = tok2.value.trim(); localStorage.setItem(TOKEN_KEY, sync.token); }
      pullSync(true);
      break;
    }
    case 'export-state': exportState(); break;
    case 'import-state': {
      var fi = qs('#importFile');
      if (fi) fi.click();
      break;
    }
    case 'reset-state': {
      confirmDialog('恢复示例数据？', '本机所有改动会被清空，回到三册错题本的初始内容。导出的 JSON 备份不受影响。', function () {
        var oldRev = state.rev || 0;
        state = seedState();
        state.rev = oldRev + 1;
        ui = { open: {}, bankOpen: {}, filters: {}, bankFilters: {} };
        persistLocal();
        applyTheme();
        render();
        schedulePush(120);
        toast('已恢复初始数据');
      });
      break;
    }
    default: break;
  }
}

function bindEvents() {
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    e.preventDefault();
    handleAction(el.getAttribute('data-act'), el);
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('[data-filter]')) {
      var key = t.getAttribute('data-filter');
      filterFor(state.activeSubject)[key] = t.value;
      render();
    } else if (t.matches('[data-bank-filter]')) {
      var bk = t.getAttribute('data-bank-filter');
      bankFilterFor(state.activeSubject)[bk] = t.value;
      render();
    } else if (t.matches('#importFile')) {
      importStateFile(t.files && t.files[0]);
      t.value = '';
    }
  });

  var search = qs('#searchInput');
  if (search) {
    var timer = null;
    search.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (state.activeView === 'overview') { render(); return; }
        render();
      }, 160);
    });
  }

  window.addEventListener('hashchange', function () {
    if (suppressHash) return;
    parseHash();
    render();
    var m = String(location.hash).match(/[?&]e=([^&]+)/);
    if (m) {
      var el = qs('#entry-' + decodeURIComponent(m[1]));
      if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  });

  document.querySelectorAll('dialog').forEach(function (d) {
    d.addEventListener('cancel', function () { /* native close */ });
  });
  var aiDlg = qs('#aiDialog');
  if (aiDlg) {
    aiDlg.addEventListener('close', function () {
      if (aiState.abort) { aiState.abort.abort(); aiState.abort = null; }
      clearAiStage();
      aiState.busy = false;
    });
  }

  window.addEventListener('focus', function () {
    if (sync.available && !document.hidden) pullSync(false);
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && sync.available) pullSync(false);
  });
}

function boot() {
  try {
    var tm = String(location.search || '').match(/[?&]token=([^&]+)/);
    if (tm) {
      sync.token = decodeURIComponent(tm[1]);
      localStorage.setItem(TOKEN_KEY, sync.token);
      if (window.history && history.replaceState) history.replaceState(null, '', location.pathname + location.hash);
    }
  } catch (e) { /* file:// */ }
  applyTheme();
  parseHash();
  render();
  bindEvents();
  var fi = document.createElement('input');
  fi.type = 'file';
  fi.accept = 'application/json,.json';
  fi.id = 'importFile';
  fi.style.display = 'none';
  document.body.appendChild(fi);
  initSync().then(function () {
    var m = String(location.hash).match(/[?&]e=([^&]+)/);
    if (m) {
      var el = qs('#entry-' + decodeURIComponent(m[1]));
      if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  });
  setInterval(function () {
    if (sync.available && !document.hidden) pullSync(false);
  }, 15000);
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener ? mq.addEventListener('change', function () { if ((state.prefs.theme || 'auto') === 'auto') applyTheme(); }) : null;
  }
}

boot();

})();
</script>
